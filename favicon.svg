<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="100%" stop-color="#0A0C0E"/>
    </linearGradient>

    <!-- 2D Color-field rainbow spectrum gradient -->
    <linearGradient id="radarSpectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="16%" stop-color="#F59E0B"/>
      <stop offset="32%" stop-color="#84CC16"/>
      <stop offset="48%" stop-color="#10B981"/>
      <stop offset="64%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <radialGradient id="stageLighting" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Chassis (Matte Obsidian) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Color Radar Floor Display Screen -->
  <g transform="translate(64, 64)">
    <rect width="384" height="384" rx="44" fill="#0D0F12"/>
    <rect width="384" height="384" rx="44" fill="url(#radarSpectrum)" opacity="0.88"/>
    <rect width="384" height="384" rx="44" fill="url(#stageLighting)"/>
    <rect width="384" height="384" rx="44" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>

    <!-- Stage Orientation Indicator -->
    <path d="M 152 28 L 192 14 L 232 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="192" cy="14" r="3.5" fill="#F59E0B"/>

    <!-- Radar Grid Lines (A1-H8 Reference) -->
    <line x1="96" y1="0" x2="96" y2="384" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="192" y1="0" x2="192" y2="384" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <line x1="288" y1="0" x2="288" y2="384" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>

    <line x1="0" y1="96" x2="384" y2="96" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="0" y1="192" x2="384" y2="192" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <line x1="0" y1="288" x2="384" y2="288" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Concentric Range Rings -->
    <circle cx="192" cy="192" r="76" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <circle cx="192" cy="192" r="148" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- Active Reticle Crosshair -->
    <circle cx="192" cy="192" r="28" fill="none" stroke="#FFFFFF" stroke-width="3" filter="url(#softGlow)"/>
    <line x1="152" y1="192" x2="176" y2="192" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="208" y1="192" x2="232" y2="192" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="152" x2="192" y2="176" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="208" x2="192" y2="232" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Reticle Pin (Amber signal) -->
    <circle cx="192" cy="192" r="9" fill="#F59E0B" stroke="#0D0F12" stroke-width="2.5"/>
  </g>

  <!-- Hardware Screws (Teenage Engineering Detail) -->
  <circle cx="36" cy="36" r="5" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="476" cy="36" r="5" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="36" cy="476" r="5" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="476" cy="476" r="5" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
</svg>
