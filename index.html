<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ChromaFloor — Crowd Spot & 2D Colour Wheel</title>
  <meta name="description" content="Super-simple 2D colour wheel crowd locator for gigs, festivals, and warehouse events." />
  <meta name="theme-color" content="#0D0F12" />

  <!-- Favicon & PWA Manifest (Strictly relative paths for GitHub Pages subpath) -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Fonts & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="themed-share-body">

  <!-- Radically Simple, Single-Column Sharing Shell (max-width: 480px) -->
  <div class="share-shell">

    <!-- Minimal Header Bar -->
    <header class="share-header">
      <div class="share-header-left">
        <a href="./" class="brand-link" aria-label="ChromaFloor Home">
          <div class="brand-mark">
            <svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#15181D" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
              <circle cx="16" cy="16" r="10" stroke="url(#shareBrandGrad)" stroke-width="3" />
              <circle cx="16" cy="16" r="3.5" fill="#F59E0B" />
              <defs>
                <linearGradient id="shareBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#EF4444" />
                  <stop offset="25%" stop-color="#F59E0B" />
                  <stop offset="50%" stop-color="#10B981" />
                  <stop offset="75%" stop-color="#06B6D4" />
                  <stop offset="100%" stop-color="#EC4899" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="brand-title">ChromaFloor</span>
        </a>
        <span id="share-event-name" class="share-event-pill">BangFace</span>
      </div>

      <div class="share-header-right">
        <a id="link-to-setup" href="./setup.html" class="btn-setup-link" title="Customize rooms, stage & bar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Setup</span>
        </a>
      </div>
    </header>

    <!-- 1. Room Selector -->
    <nav id="room-tabs" class="room-tabs share-room-tabs" role="tablist" aria-label="Select Room"></nav>

    <!-- Sleek single-line frosted Live Bar -->
    <div id="live-bar" class="live-bar">
      <button id="btn-live-toggle" type="button" class="live-status-pill" title="Start or copy Live Finder session">
        <span id="live-dot" class="live-dot"></span>
        <span id="live-status-text">Go Live</span>
      </button>
      <input id="live-name-input" type="text" class="live-name-input" maxlength="20" placeholder="Your name (optional)" aria-label="Your name for Live Finder" />
    </div>
    <div id="live-peers-strip" class="live-peers-strip hidden"></div>

    <!-- Optional incoming friend banner (hidden unless a shared link was opened) -->
    <div id="shared-friend-banner" class="shared-friend-banner hidden"></div>

    <!-- 2. The 2D Colour Wheel Map Card -->
    <section class="wheel-stage-card" aria-label="2D Colour Wheel Stage Radar">
      <div class="wheel-top-strip">
        <div class="orientation-box">
          <span class="stage-dir-dot"></span>
          <span id="orientation-hint" class="orientation-hint">FACING STAGE ↑</span>
        </div>
        <button id="btn-flip-wheel" type="button" class="btn-flip-wheel" title="Flip perspective 180°">🔄 Flip</button>
      </div>

      <!-- Square 1:1 Viewport -->
      <div id="map-viewport" class="map-viewport share-wheel-viewport" tabindex="0" role="application" aria-label="Tap or drag on the colour wheel to choose where you are">
        <canvas id="floor-canvas" width="800" height="800"></canvas>
        <div id="map-overlay" class="map-overlay"></div>
      </div>
    </section>

    <!-- 3. Your Chosen Colour Readout -->
    <div id="spot-readout" class="spot-readout-row">
      <div class="spot-readout-info">
        <h1 id="swatch-color-name" class="spot-color-title">Bright Mint</h1>
        <div id="swatch-meta" class="spot-color-meta">Zone G3 · #49FB82 · Toward Speaker</div>
      </div>
      <button id="btn-fullscreen-beacon" type="button" class="btn-themed-glass" title="Fill screen with pure colour">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span>Fullscreen</span>
      </button>
    </div>

    <!-- 4. Single Share / Copy Button -->
    <button id="btn-share-spot" type="button" class="btn-primary-amber btn-single-share">
      <span id="share-btn-label">Share / Copy My Spot</span>
    </button>

    <!-- Minimal footer info -->
    <footer class="share-footer">
      <span>Zero-Backend 2D Colour Locator</span>
      <span class="footer-sep">·</span>
      <span>PWA Offline</span>
    </footer>

  </div>

  <!-- Full-Screen Crowd Color Beacon Modal -->
  <div id="beacon-modal" class="beacon-modal hidden" role="dialog" aria-modal="true" aria-label="Crowd Color Beacon">
    <div class="beacon-controls-top">
      <div class="beacon-title-badge">⚡ CROWD COLOR BEACON</div>
      <button id="beacon-pulse-btn" type="button" class="beacon-top-btn">Pulse: OFF</button>
      <button id="beacon-close-btn" type="button" class="beacon-close-icon-btn" aria-label="Close beacon">✕</button>
    </div>

    <div class="beacon-center-content">
      <div id="beacon-room-label" class="beacon-room-label">Main Room</div>
      <div id="beacon-zone-code" class="beacon-zone-code">D4</div>
      <div id="beacon-color-title" class="beacon-color-title">Pearl White</div>
      <div id="beacon-hex-code" class="beacon-hex-code">#F8FAFC</div>
      <div class="beacon-brightness-tip">
        Hold screen high above the crowd facing your friends so they spot your colour across the floor.
      </div>
    </div>

    <div class="beacon-controls-bottom">
      <button id="beacon-exit-btn" type="button" class="beacon-exit-btn" onclick="document.getElementById('beacon-close-btn').click()">
        Exit Beacon (Tap anywhere or Esc)
      </button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Logic (Strict relative paths) -->
  <script src="./js/color-engine.js"></script>
  <script src="./js/url-state.js"></script>
  <script src="./js/live-sync.js"></script>
  <script src="./js/share-app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => console.log('[ChromaFloor] Service worker registered with scope:', reg.scope))
          .catch((err) => console.warn('[ChromaFloor] Service worker registration error:', err));
      });
    }
  </script>

</body>
</html>
